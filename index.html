<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #1a1a2e;
            --grid-bg: #16213e;
            --cell-bg: #0f3460;
            --text-light: #f9f6f2;
            --text-dark: #776e65;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f2b179, #f59563, #f67c5f, #f65e3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(242, 177, 121, 0.3);
        }

        .scores {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: var(--grid-bg);
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            min-width: 90px;
            position: relative;
            overflow: hidden;
        }

        .score-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f2b179, transparent);
        }

        .score-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            color: var(--text-light);
            transition: transform 0.1s;
        }

        .score-value.bump {
            animation: scoreBump 0.2s ease;
        }

        @keyframes scoreBump {
            50% { transform: scale(1.2); }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .instructions {
            color: #666;
            font-size: 0.85rem;
        }

        .new-game-btn {
            background: linear-gradient(135deg, #f2b179, #f65e3b);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(242, 94, 61, 0.3);
        }

        .new-game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(242, 94, 61, 0.4);
        }

        .new-game-btn:active {
            transform: translateY(0);
        }

        .grid-container {
            background: var(--grid-bg);
            border-radius: 12px;
            padding: 12px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .cell {
            aspect-ratio: 1;
            background: var(--cell-bg);
            border-radius: 8px;
            position: relative;
        }

        .tile-container {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            border-radius: 8px;
            transition: top 0.15s ease, left 0.15s ease;
            user-select: none;
        }

        .tile.new {
            animation: appear 0.2s ease;
        }

        .tile.merged {
            animation: merge 0.2s ease;
        }

        @keyframes appear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-overlay h2 {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: #f65e3b;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(246, 94, 59, 0.5);
        }

        .game-over-overlay.win h2 {
            background: linear-gradient(135deg, #edcf72, #edc22e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-over-overlay p {
            color: #888;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .overlay-btn {
            background: linear-gradient(135deg, #f2b179, #f65e3b);
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .overlay-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 520px) {
            .title {
                font-size: 2rem;
            }

            .score-box {
                padding: 8px 12px;
                min-width: 70px;
            }

            .score-value {
                font-size: 1.2rem;
            }

            .grid-container {
                padding: 8px;
            }

            .grid {
                gap: 8px;
            }

            .tile-container {
                top: 8px;
                left: 8px;
                right: 8px;
                bottom: 8px;
            }

            .instructions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">2048</h1>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">分数</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">最高</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <p class="instructions">使用方向键或滑动来移动方块</p>
            <button class="new-game-btn" id="newGameBtn">新游戏</button>
        </div>

        <div class="grid-container">
            <div class="grid" id="grid">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
            <div class="tile-container" id="tileContainer"></div>
            <div class="game-over-overlay" id="gameOverOverlay">
                <h2 id="gameOverTitle">游戏结束</h2>
                <p id="gameOverScore">得分: 0</p>
                <button class="overlay-btn" id="tryAgainBtn">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 4;
        const CELL_GAP = 12;
        const COLORS = {
            2: { bg: '#eee4da', text: '#776e65' },
            4: { bg: '#ede0c8', text: '#776e65' },
            8: { bg: '#f2b179', text: '#f9f6f2' },
            16: { bg: '#f59563', text: '#f9f6f2' },
            32: { bg: '#f67c5f', text: '#f9f6f2' },
            64: { bg: '#f65e3b', text: '#f9f6f2' },
            128: { bg: '#edcf72', text: '#f9f6f2', fontSize: '1.8rem' },
            256: { bg: '#edcc61', text: '#f9f6f2', fontSize: '1.8rem' },
            512: { bg: '#edc850', text: '#f9f6f2', fontSize: '1.8rem' },
            1024: { bg: '#edc53f', text: '#f9f6f2', fontSize: '1.4rem' },
            2048: { bg: '#edc22e', text: '#f9f6f2', fontSize: '1.4rem' },
            super: { bg: '#3c3a32', text: '#f9f6f2', fontSize: '1.2rem' }
        };

        let grid = [];
        let score = 0;
        let best = parseInt(localStorage.getItem('2048-best')) || 0;
        let isAnimating = false;

        const tileContainer = document.getElementById('tileContainer');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverScore = document.getElementById('gameOverScore');

        function init() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            updateScore();
            bestEl.textContent = best;
            tileContainer.innerHTML = '';
            gameOverOverlay.classList.remove('show', 'win');

            addRandomTile();
            addRandomTile();
        }

        function getCellSize() {
            const gridEl = document.getElementById('grid');
            const cell = gridEl.querySelector('.cell');
            return cell.offsetWidth;
        }

        function getGap() {
            return CELL_GAP;
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === 0) {
                        emptyCells.push({ r, c });
                    }
                }
            }
            if (emptyCells.length === 0) return;

            const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            grid[r][c] = value;
            createTileElement(r, c, value, true);
        }

        function createTileElement(r, c, value, isNew = false) {
            const cellSize = getCellSize();
            const gap = getGap();
            const tile = document.createElement('div');
            tile.className = 'tile' + (isNew ? ' new' : '');
            tile.dataset.row = r;
            tile.dataset.col = c;
            tile.textContent = value;

            const colorData = COLORS[value] || COLORS.super;
            tile.style.width = cellSize + 'px';
            tile.style.height = cellSize + 'px';
            tile.style.left = (c * (cellSize + gap)) + 'px';
            tile.style.top = (r * (cellSize + gap)) + 'px';
            tile.style.background = colorData.bg;
            tile.style.color = colorData.text;
            tile.style.fontSize = colorData.fontSize || '2rem';
            tile.style.boxShadow = `0 0 20px ${colorData.bg}40`;

            tileContainer.appendChild(tile);
            return tile;
        }

        function updateScore() {
            scoreEl.textContent = score;
            scoreEl.classList.remove('bump');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('bump');

            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem('2048-best', best);
            }
        }

        function move(direction) {
            if (isAnimating) return;

            const oldGrid = grid.map(row => [...row]);
            let moved = false;
            const mergedPositions = [];

            const vectors = {
                up: { dr: -1, dc: 0 },
                down: { dr: 1, dc: 0 },
                left: { dr: 0, dc: -1 },
                right: { dr: 0, dc: 1 }
            };

            const { dr, dc } = vectors[direction];
            const rowStart = dr === 1 ? GRID_SIZE - 1 : 0;
            const rowEnd = dr === 1 ? -1 : GRID_SIZE;
            const rowStep = dr === 1 ? -1 : 1;
            const colStart = dc === 1 ? GRID_SIZE - 1 : 0;
            const colEnd = dc === 1 ? -1 : GRID_SIZE;
            const colStep = dc === 1 ? -1 : 1;

            for (let r = rowStart; r !== rowEnd; r += rowStep) {
                for (let c = colStart; c !== colEnd; c += colStep) {
                    if (grid[r][c] === 0) continue;

                    let newR = r;
                    let newC = c;

                    while (true) {
                        const nextR = newR + dr;
                        const nextC = newC + dc;

                        if (nextR < 0 || nextR >= GRID_SIZE || nextC < 0 || nextC >= GRID_SIZE) break;

                        if (grid[nextR][nextC] === 0) {
                            newR = nextR;
                            newC = nextC;
                        } else if (grid[nextR][nextC] === grid[r][c] &&
                                   !mergedPositions.some(p => p.r === nextR && p.c === nextC)) {
                            newR = nextR;
                            newC = nextC;
                            break;
                        } else {
                            break;
                        }
                    }

                    if (newR !== r || newC !== c) {
                        moved = true;

                        if (grid[newR][newC] === grid[r][c]) {
                            const newValue = grid[r][c] * 2;
                            grid[newR][newC] = newValue;
                            grid[r][c] = 0;
                            score += newValue;
                            mergedPositions.push({ r: newR, c: newC });
                        } else {
                            grid[newR][newC] = grid[r][c];
                            grid[r][c] = 0;
                        }
                    }
                }
            }

            if (moved) {
                isAnimating = true;
                renderTiles();

                setTimeout(() => {
                    addRandomTile();
                    updateScore();
                    isAnimating = false;

                    if (checkWin()) {
                        showGameOver(true);
                    } else if (!canMove()) {
                        showGameOver(false);
                    }
                }, 150);
            }
        }

        function renderTiles() {
            tileContainer.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] !== 0) {
                        createTileElement(r, c, grid[r][c]);
                    }
                }
            }
        }

        function checkWin() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === 2048) return true;
                }
            }
            return false;
        }

        function canMove() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === 0) return true;
                    if (c < GRID_SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
                    if (r < GRID_SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
                }
            }
            return false;
        }

        function showGameOver(isWin) {
            gameOverTitle.textContent = isWin ? '你赢了!' : '游戏结束';
            gameOverScore.textContent = '得分: ' + score;
            gameOverOverlay.classList.add('show');
            if (isWin) {
                gameOverOverlay.classList.add('win');
            }
        }

        document.addEventListener('keydown', (e) => {
            const keyMap = {
                ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right'
            };

            if (keyMap[e.key]) {
                e.preventDefault();
                move(keyMap[e.key]);
            }
        });

        let touchStartX, touchStartY;
        const gameContainer = document.querySelector('.game-container');

        gameContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        gameContainer.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            const minSwipeDistance = 30;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > minSwipeDistance) {
                    move(dx > 0 ? 'right' : 'left');
                }
            } else {
                if (Math.abs(dy) > minSwipeDistance) {
                    move(dy > 0 ? 'down' : 'up');
                }
            }

            touchStartX = null;
            touchStartY = null;
        }, { passive: true });

        document.getElementById('newGameBtn').addEventListener('click', init);
        document.getElementById('tryAgainBtn').addEventListener('click', init);

        window.addEventListener('resize', () => {
            renderTiles();
        });

        init();
    </script>
</body>
</html>
